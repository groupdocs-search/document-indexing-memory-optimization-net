version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # GroupDocs.Search is pinned in Directory.Packages.props. A version bump changes
    # what the published measurements mean, so these PRs need a benchmark re-run
    # before merge, not just a green build.
    labels:
      - dependencies
      - needs-benchmark-rerun

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
