name: Bug report
description: Something in this repository's code is wrong or does not build.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For problems with GroupDocs.Search itself rather than these samples,
        please use the product forum linked on the issue chooser.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Include the exact command and any environment variables you set.
      render: shell
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and .NET SDK version
      placeholder: "Ubuntu 24.04, .NET SDK 8.0.404"
    validations:
      required: true
